name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-desktop:
    name: Validate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend types
        run: pnpm check

      - name: Build Web edition
        run: pnpm build

      - name: Check Tauri crate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build desktop bundle
        run: pnpm exec tauri build --ci --target ${{ matrix.target }}
